# Personal Wiki CLI configuration. Paths are relative to this file.

model:
  # Local Ollama model name, created from Google's official QAT GGUF (see README "Setup").
  name: gemma4-e2b-qat
  identifier: google/gemma-4-E2B-it-qat-q4_0-gguf (gemma-4-E2B_q4_0-it.gguf)
  quantization: Q4_0 (quantization-aware trained)
  host: http://127.0.0.1:11434
  num_ctx: 8192        # context window requested from Ollama (one value for all modes avoids reloads)
  think: false         # Gemma 4 "thinking" off: too slow on an 8 GB M1 for little gain here
  timeout_s: 300
  temperature:
    ingest: 0.2
    ask: 0.0
    chat: 0.4          # lowered from 0.6 after dev runs: fewer loose citations
    router: 0.0

paths:
  vault: vault
  raw: vault/raw
  wiki: vault/wiki
  data: data            # passages, retrieval index, note catalog (machine files, outside the vault)
  runs: runs            # saved outputs of every ask / search / chat run
  drafts: drafts        # chat drafts saved with /save (never indexed as evidence)
  prompts: prompts
  evidence: evidence

retrieval:
  passage_words: 180    # target passage size
  max_passage_words: 240
  ask_top_k: 5
  chat_top_k: 4
  search_top_k: 5
  min_score: 3.0        # below this BM25 score, retrieval counts as "nothing relevant found"

chat:
  history_turns: 6      # user+assistant pairs kept verbatim
  history_chars: 9000   # hard cap on history text sent to the model

wiki:
  folders: [Companies, Stories, Background, Concepts]
