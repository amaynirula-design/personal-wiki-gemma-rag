[project]
name = "wiki-cli"
version = "0.1.0"
description = "Personal interview-prep wiki with a local Gemma model and RAG"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.scripts]
wiki = "wiki_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wiki_cli"]
